<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact CannaShield for cannabis cybersecurity, GRC, email security, automation, and compliance support.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://cannashieldct.com/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CannaShield">
  <meta property="og:title" content="Contact CannaShield | Cannabis Cybersecurity Support">
  <meta property="og:description" content="Talk with CannaShield about cybersecurity, GRC, email security, and automation support for cannabis operators.">
  <meta property="og:url" content="https://cannashieldct.com/contact.html">
  <meta property="og:image" content="https://cannashieldct.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact CannaShield | Cannabis Cybersecurity Support">
  <meta name="twitter:description" content="Contact CannaShield for cannabis cybersecurity and compliance support.">
  <meta name="twitter:image" content="https://cannashieldct.com/og-image.png">
  <title>Contact CannaShield | Cannabis Cybersecurity Support</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "@id": "https://cannashieldct.com/contact.html#webpage",
      "url": "https://cannashieldct.com/contact.html",
      "name": "Contact CannaShield",
      "about": { "@id": "https://cannashieldct.com/#organization" },
      "mainEntity": {
        "@type": "Organization",
        "@id": "https://cannashieldct.com/#organization",
        "name": "CannaShield",
        "email": "alejo@cannashieldct.com",
        "telephone": "+1-203-443-1473"
      }
    }
  </script>
</head>
<body>

<div id="navbar-placeholder"></div>

<section id="hero-contact" class="fade-in">
  <h1>Contact Us</h1>
  <p>We’re here to help you secure your cannabis business.</p>
</section>

<section id="contact-info" class="section-container fade-in">
  <div class="contact-grid">
    <div class="contact-card">
      <h2>📧 Email Us</h2>
      <p>Have questions? Reach out to us at:</p>
      <a href="mailto:alejo@cannashieldct.com">alejo@cannashieldct.com</a>
    </div>
    <div class="contact-card">
      <h2>📞 Call Us</h2>
      <p>Prefer to talk? Give us a call:</p>
      <p><a href="tel:+12034431473">(203) 443-1473</a></p>
    </div>
    <div class="contact-card">
      <h2>📍 Visit Us</h2>
      <p>Stop by our office:</p>
      <p>Coming Soon</p>
    </div>
  </div>
</section>

<section id="contact-form" class="section-container fade-in">
  <h2>Send Us a Message</h2>
  <div class="form-container">
    <form action="https://formspree.io/f/xanoejpw" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="cta-button">Send Message</button>
    </form>
  </div>
</section>

<div id="footer-placeholder"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => document.getElementById("navbar-placeholder").innerHTML = data);

    fetch("footer.html")
      .then(response => response.text())
      .then(data => document.getElementById("footer-placeholder").innerHTML = data);
  });
</script>

</body>
</html>
